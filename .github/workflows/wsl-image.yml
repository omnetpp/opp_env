name: Build and release the opp_env WSL image

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
      publish:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      version:
        description: "opp_env version to install from PyPI (empty: the latest one)"
        type: string
        default: ''
      publish:
        description: "Push the docker image to ghcr and replace opp_env.wsl in the 'wsl' release"
        type: boolean
        default: false

jobs:
  wsl-image:
    name: Build and release the WSL image
    runs-on: ubuntu-latest
    # never cancel a run that may be in the middle of replacing the release asset
    concurrency:
      group: wsl-image
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      IMAGE: ghcr.io/omnetpp/opp_env

    steps:
    - name: Check that publishing is allowed from this ref
      if: inputs.publish
      run: |
        case "$GITHUB_REF" in
          refs/heads/main|refs/tags/*) ;;
          *) echo "::error::Publishing is only allowed from main or a tag, not from $GITHUB_REF"; exit 1 ;;
        esac

    - uses: actions/checkout@v4

    - name: Determine the opp_env version
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        VERSION=${INPUT_VERSION:-$(curl -fsSL https://pypi.org/pypi/opp-env/json | jq -r .info.version)}
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"

    - name: Build the docker image and the WSL image
      run: CONTAINER=docker docker/build "$VERSION"

    - name: Smoke test
      run: |
        gzip -t docker/opp_env.wsl
        # the image's .profile (sourced by the entrypoint) runs 'clear', which fails without TERM
        docker run --rm -e TERM=xterm -e EXPECTED_VERSION="$VERSION" "$IMAGE:$VERSION" bash -c '
          set -e
          test "$(opp_env --version)" = "$EXPECTED_VERSION"
          nix --version
          opp_env list > /dev/null'

    - name: Push the docker image to ghcr
      if: inputs.publish
      run: |
        echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        docker push "$IMAGE:$VERSION"
        docker push "$IMAGE:latest"

    # Upload under a temporary name first, so the download URL is only missing for a moment.
    # A new asset starts with a zero download count, so the old asset's count is carried over
    # into the release body before the old asset is deleted. The id of the last counted asset
    # is recorded too, so that re-running after a failed delete does not count it twice.
    - name: Replace opp_env.wsl in the 'wsl' release
      if: inputs.publish
      run: |
        mv docker/opp_env.wsl opp_env.wsl.new
        gh release upload wsl opp_env.wsl.new --clobber --repo "$REPO"
        gh api "repos/$REPO/releases/tags/wsl" > release.json
        old_id=$(jq -r '.assets[] | select(.name == "opp_env.wsl") | .id' release.json)
        old_count=$(jq -r '.assets[] | select(.name == "opp_env.wsl") | .download_count' release.json)
        new_id=$(jq -r '.assets[] | select(.name == "opp_env.wsl.new") | .id' release.json)
        jq -r .body release.json > body.md
        python3 - body.md "$VERSION" "$(date -u +%Y-%m-%d)" "$old_id" "$old_count" <<'EOF'
        import re, sys
        path, version, date, old_id, old_count = sys.argv[1:]
        begin, end = "<!-- wsl-image-version -->", "<!-- /wsl-image-version -->"
        pattern = re.escape(begin) + ".*?" + re.escape(end)
        body = open(path).read().rstrip()
        match = re.search(pattern, body, flags=re.S)
        block = match.group(0) if match else ""
        m = re.search(r"Downloads of earlier builds: (\d+)", block)
        earlier = int(m.group(1)) if m else 0
        m = re.search(r"<!-- counted-asset: (\d*) -->", block)
        counted = m.group(1) if m else ""
        if old_id and old_id != counted:
            earlier += int(old_count)
            counted = old_id
        note = (f"{begin}\n**Contains opp_env {version}, built on {date}.**\n\n"
                f"Downloads of earlier builds: {earlier}\n<!-- counted-asset: {counted} -->\n{end}")
        body = body.replace(block, note) if match else body + "\n\n" + note
        open(path, "w").write(body + "\n")
        EOF
        gh release edit wsl --repo "$REPO" --notes-file body.md
        if [ -n "$old_id" ]; then gh api -X DELETE "repos/$REPO/releases/assets/$old_id"; fi
        gh api -X PATCH "repos/$REPO/releases/assets/$new_id" -f name=opp_env.wsl > /dev/null
